<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>One Letter Elsewhere — V28 Perceptual Drift</title>
<style>
/* One Letter Elsewhere V27 — clean stylesheet */
:root {
  --ink: #151515;
  --soft-ink: #555;
  --canvas: #b9b9b5;
  --paper: #efefeb;
  --paper-dark: #d2d2ce;
  --ease-mechanical: cubic-bezier(.5, 0, .2, 1);
}

* { box-sizing: border-box; }

html,
body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  background: var(--canvas);
  font-family: "Courier New", ui-monospace, Menlo, monospace;
}

button,
input { font: inherit; }

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  opacity: .22;
  mix-blend-mode: multiply;
  background-image:
    radial-gradient(circle at 17% 23%, rgba(0, 0, 0, .22) 0 .45px, transparent .7px),
    radial-gradient(circle at 71% 64%, rgba(0, 0, 0, .16) 0 .5px, transparent .8px),
    radial-gradient(circle at 42% 81%, rgba(0, 0, 0, .12) 0 .4px, transparent .75px);
  background-size: 7px 9px, 11px 13px, 17px 19px;
}

.scene {
  min-height: 100vh;
  padding: 24px clamp(18px, 4vw, 44px);
}

.scene[hidden],
.fallback[hidden],
.image-fit-toggle[hidden] { display: none; }

/* Entry scene */
.entry {
  position: relative;
  display: grid;
  grid-template-rows: auto 1fr auto;
  background: radial-gradient(ellipse at 50% 42%, #e4e4e0 0, #cececa 58%, #b4b4b0 100%);
  transition: background .48s ease, opacity .46s ease;
}

.entry::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0, 0, 0, .018) 3px 4px);
}

.top {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  font-size: 11px;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.top div:last-child {
  max-width: 360px;
  text-align: right;
  line-height: 1.55;
}

.top,
.footer,
.tw-hint {
  position: relative;
  z-index: 2;
  color: #50504e;
}

.footer { font-size: 12px; }

.entry-main {
  position: relative;
  display: grid;
  place-items: center;
}

.stage {
  position: relative;
  display: grid;
  justify-items: center;
  filter: grayscale(1);
  transform-origin: 50% 38%;
  transition: transform 1.15s var(--ease-mechanical);
}

.stage.zoom { transform: scale(1.18) translateY(1%); }

/* Paper and typed word */
.paper {
  position: relative;
  z-index: 0;
  width: min(570px, 86vw);
  min-height: 280px;
  margin-bottom: -30px;
  padding: 55px 42px 92px;
  overflow: visible;
  cursor: text;
  border: 1px solid rgba(0, 0, 0, .19);
  background-color: var(--paper);
  background-image:
    radial-gradient(circle at 18% 22%, rgba(0, 0, 0, .055) 0 1px, transparent 1.4px),
    radial-gradient(circle at 76% 63%, rgba(0, 0, 0, .04) 0 1px, transparent 1.2px),
    repeating-linear-gradient(87deg, rgba(255, 255, 255, .12) 0 1px, rgba(0, 0, 0, .018) 1px 2px, transparent 2px 7px);
  background-size: 17px 19px, 23px 29px, auto;
  box-shadow: 0 2px 0 rgba(255, 255, 255, .5), 0 13px 28px rgba(0, 0, 0, .28);
}

.paper::before {
  content: "";
  position: absolute;
  top: 34px;
  right: 24px;
  left: 24px;
  border-top: 1px solid rgba(60, 52, 38, .12);
}

.paper::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  box-shadow: inset 0 0 34px rgba(0, 0, 0, .08);
  clip-path: polygon(0 1%, 7% 0, 16% 1%, 29% 0, 42% .7%, 58% 0, 73% 1%, 88% 0, 100% .8%, 100% 99%, 91% 100%, 80% 99.2%, 66% 100%, 52% 99%, 38% 100%, 22% 99.2%, 8% 100%, 0 99%);
}

.paper-line {
  position: relative;
  z-index: 1;
  min-height: 1.35em;
  color: #232019;
  font-size: clamp(34px, 6vw, 56px);
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: lowercase;
  text-shadow: .5px 0 #111, -.35px .5px rgba(0, 0, 0, .4);
}

.paper-line span {
  position: relative;
  display: inline-block;
  animation: type-hit .13s steps(2, end);
}

.paper-line span:nth-child(3n) { transform: translateY(1px) rotate(.25deg); }
.paper-line span:nth-child(4n) { opacity: .87; }
.paper-line span.strike { animation: strike .3s ease; }

.paper-line > span.new-letter-mark {
  display: inline-grid;
  place-items: center;
  width: .86em;
  margin: 0 .07em;
  color: #f1f1ed;
  background: #191919;
  text-shadow: none;
  box-shadow: 2px 2px 0 rgba(0, 0, 0, .18);
  animation: new-letter-clean .46s cubic-bezier(.18, .8, .22, 1);
}

.entry.typing .paper-line::after {
  content: "▌";
  display: inline-block;
  margin-left: .03em;
  color: #222;
  animation: caret .82s steps(1, end) infinite;
}

@keyframes caret { 50% { opacity: 0; } }

@keyframes type-hit {
  0% { opacity: .25; filter: blur(.7px); transform: translateY(-5px); }
  100% { opacity: 1; filter: none; transform: translateY(0); }
}

@keyframes strike {
  0%, 100% { transform: translateY(0); }
  40% { opacity: .4; transform: translateY(-4px) rotate(-5deg); }
}

@keyframes new-letter-clean {
  0% { opacity: 0; transform: translateY(-26px) rotate(-3deg); }
  65% { opacity: 1; transform: translateY(3px) rotate(.5deg); }
  100% { transform: translateY(0) rotate(0); }
}

/* Typewriter */
.typewriter { position: relative; z-index: 1; }

.tw-body {
  padding: 22px 24px 26px;
  border: 1px solid #111;
  border-radius: 16px 16px 10px 10px;
  background: linear-gradient(150deg, #4b4b49, #20201f 68%);
  box-shadow: 0 22px 46px rgba(0, 0, 0, .46), inset 0 2px 0 rgba(255, 255, 255, .1);
}

.tw-keys { position: relative; display: grid; gap: 9px; }
.tw-row { display: flex; justify-content: center; gap: 8px; }
.tw-row:nth-child(3) { margin-left: 14px; }
.tw-row:nth-child(4) { margin-left: 30px; }

.tw-key {
  display: grid;
  place-items: center;
  width: clamp(28px, 4.2vw, 44px);
  height: clamp(28px, 4.2vw, 44px);
  color: #181818;
  border: 2px solid #111;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #eeeeea, #c6c6c1 60%, #8b8b87);
  box-shadow: 0 5px 0 #111;
  font-size: clamp(11px, 1.4vw, 15px);
  font-weight: 700;
  text-transform: uppercase;
  user-select: none;
  transition: transform .07s, box-shadow .07s, background .1s, color .1s;
}

.tw-key.press { transform: translateY(4px); box-shadow: 0 1px 0 #111; }
.tw-key.press-ink { color: #f2f2ed; background: #191918; outline-color: #191918; box-shadow: 0 1px 0 #080808; }
.tw-key.lit,
.tw-key.source-key { background: radial-gradient(circle at 35% 30%, #f5f5f1, #cfcfca 62%, #999); }
.tw-key.source-key { outline: 2px dashed #777; outline-offset: 4px; }
.tw-key.lit-red,
.tw-key.destination-key { color: #f4f4ef; background: radial-gradient(circle at 35% 30%, #70706d, #292928); }
.tw-key.destination-key { outline: 3px solid #111; outline-offset: 4px; }

.tw-return {
  width: auto;
  min-width: 52px;
  padding: 0 16px;
  color: #f2f2ed;
  border-radius: 12px;
  background: radial-gradient(circle at 35% 30%, #696967, #343433);
  font-size: clamp(14px, 1.8vw, 19px);
  cursor: pointer;
}

.tw-return:hover { background: radial-gradient(circle at 35% 30%, #7c7c79, #3b3b39); }

.touch {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 3;
  width: 48px;
  height: 48px;
  opacity: 0;
  pointer-events: none;
  border-radius: 50%;
  background: radial-gradient(rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 70%);
  transition: transform .95s cubic-bezier(.55, 0, .3, 1), opacity .35s;
}

.touch.on { opacity: 1; }

.tw-hint {
  margin-top: 26px;
  font-size: 11px;
  letter-spacing: .15em;
  text-align: center;
  text-transform: uppercase;
  transition: opacity .5s;
}

.ghost-field {
  position: fixed;
  top: 0;
  left: 0;
  width: 1px;
  height: 1px;
  opacity: .01;
  pointer-events: none;
}

/* Correction and lookup */
.correction {
  position: absolute;
  bottom: 66px;
  left: 50%;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 13px;
  width: max-content;
  max-width: calc(100% - 48px);
  padding: 8px 12px;
  opacity: 0;
  color: #666;
  border: 1px solid #888;
  background: rgba(232, 232, 227, .96);
  box-shadow: 3px 4px 0 rgba(0, 0, 0, .12);
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  translate: -50% 0;
  transform: translateY(5px);
  transition: opacity .35s, transform .35s;
}

.correction.on { opacity: 1; translate: -50% 0; transform: translateY(0); }
.correction-label { padding-right: 12px; white-space: nowrap; border-right: 1px solid #999; }
.correction-route { display: flex; align-items: center; gap: 7px; color: #222; font-size: 12px; }

.correction-route b {
  display: grid;
  place-items: center;
  width: 23px;
  height: 23px;
  border: 1px solid #333;
  background: #e6e6e1;
  box-shadow: 0 2px 0 #333;
  font-size: 13px;
}

.correction-route b:last-child { color: #f1f1ed; background: #222; }

.entry.lookup-mode { background: #1d1d1c; }
.entry.lookup-mode .top,
.entry.lookup-mode .footer { opacity: .42; color: #aaa; transition: opacity .4s, color .4s; }
.entry.lookup-mode .typewriter { opacity: .55; filter: grayscale(1) brightness(.3); transition: filter .48s, opacity .48s; }
.entry.lookup-mode .paper-line { z-index: 1; opacity: .16; transition: opacity .4s; }
.entry.lookup-mode .paper::after { z-index: 10; background: rgba(14, 14, 13, .72); transition: background .48s; }

.correction.lookup {
  inset: 38px;
  z-index: 30;
  display: grid;
  grid-template: 1fr 1fr / 1fr;
  width: auto;
  height: auto;
  min-width: 0;
  max-width: none;
  padding: 0;
  gap: 0;
  border-color: #333;
  box-shadow: 6px 7px 0 rgba(0, 0, 0, .16);
  translate: 0 0;
  animation: lookup-grow-centered .52s cubic-bezier(.18, .8, .22, 1) both;
}

.lookup-copy {
  display: grid;
  grid-row: 1;
  place-content: center;
  justify-items: center;
  gap: 6px;
  text-align: center;
}

.lookup-copy .correction-label { padding: 0; color: #555; border: 0; font-size: 10px; letter-spacing: .16em; }
.lookup-target { display: flex; align-items: baseline; justify-content: center; gap: 7px; }
.lookup-word { color: #151515; font-size: clamp(26px, 3.2vw, 40px); line-height: 1; letter-spacing: .08em; }
.lookup-dots { color: #555; font-size: 18px; letter-spacing: .08em; animation: lookup-breathe 1.15s ease-in-out infinite; }

.search-rail.single-door {
  display: flex;
  grid-row: 2;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 10px 0 0;
  overflow: hidden;
  border-top: 1px solid #888;
}

.world-door {
  position: relative;
  display: block;
  width: 38px;
  height: 54px;
  opacity: 1;
  border: 2px solid #3c3c3a;
  border-bottom-width: 3px;
  background: linear-gradient(90deg, #d7d7d2, #f3f3ef);
  perspective: 90px;
}

.door-panel {
  position: absolute;
  inset: 2px;
  display: block;
  border: 1px solid #171717;
  background: #343432;
  box-shadow: inset -4px 0 0 rgba(255, 255, 255, .05);
  transform: rotateY(0);
  transform-origin: left center;
  animation: door-unlock-open 3.25s cubic-bezier(.45, 0, .22, 1) forwards;
}

.door-panel::before {
  content: "";
  position: absolute;
  top: 48%;
  left: 50%;
  width: 7px;
  height: 9px;
  opacity: .85;
  border: 1px solid #d8d8d3;
  border-radius: 4px 4px 1px 1px;
  translate: -50% -50%;
  animation: lock-release 3.25s ease forwards;
}

.door-panel::after {
  content: "";
  position: absolute;
  top: 25px;
  right: 4px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #e9e9e4;
}

@keyframes lookup-grow-centered {
  0% { opacity: .2; transform: scale(.8); }
  100% { opacity: 1; transform: scale(1); }
}

@keyframes lookup-breathe { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }

@keyframes door-unlock-open {
  0%, 28% { transform: rotateY(0); }
  34% { transform: rotateY(-3deg); }
  42% { transform: rotateY(0); }
  55% { transform: rotateY(-12deg); }
  100% { transform: rotateY(-64deg); box-shadow: 8px 2px 10px rgba(0, 0, 0, .22); }
}

@keyframes lock-release {
  0%, 31% { opacity: .85; transform: translateY(0); }
  43% { opacity: 1; transform: translateY(3px); }
  52%, 100% { opacity: 0; transform: translateY(7px); }
}

.entry.scene-fade-out { opacity: 0; }

/* Result scene */
.result {
  height: 100dvh;
  min-height: 100dvh;
  padding: 0;
  overflow: hidden;
  background: #bcbcb8;
}

.arrival {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1.65fr) minmax(360px, .82fr);
  grid-template-rows: minmax(0, 1fr);
  align-items: stretch;
  gap: clamp(20px, 3vw, 44px);
  height: 100dvh;
  min-height: 100dvh;
  max-height: 100dvh;
  padding: clamp(18px, 3vw, 42px);
  overflow: hidden;
  background: #bcbcb8;
}

.arrival::before {
  content: "ARCHIVE / ADJACENT DESTINATION";
  position: absolute;
  top: 8px;
  left: clamp(18px, 3vw, 42px);
  color: #4c4c4a;
  font-size: 9px;
  letter-spacing: .28em;
}

.result.result-arrive .arrival { animation: result-arrive .56s ease both; }

@keyframes result-arrive {
  0% { opacity: 0; transform: translateY(7px); }
  100% { opacity: 1; transform: translateY(0); }
}

.pic {
  position: relative;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  border: 1px solid #232323;
  background: var(--paper-dark);
  box-shadow: 9px 11px 0 rgba(0, 0, 0, .13), inset 0 0 0 1px rgba(35, 32, 25, .35);
}

.pic img {
  position: absolute;
  inset: 14px;
  width: calc(100% - 28px);
  height: calc(100% - 28px);
  object-fit: cover;
  object-position: center;
  background: var(--paper-dark);
}

.pic.fit-full img { object-fit: contain; }

#image { filter: contrast(1.07) brightness(.93) saturate(.94); }

#imageGray {
  filter: grayscale(1) contrast(1.12) brightness(.88);
  clip-path: inset(0);
  transition: clip-path 2.8s cubic-bezier(.62, 0, .25, 1) .35s;
}

.result.color-source.wash #imageGray { clip-path: inset(0 0 0 100%); }
.result.mono-source #imageGray { display: none; }

.pic::after {
  content: "";
  position: absolute;
  inset: 14px;
  z-index: 3;
  opacity: .28;
  pointer-events: none;
  background: repeating-radial-gradient(circle at 30% 20%, rgba(0, 0, 0, .14) 0 1px, transparent 1.4px 4px);
  mix-blend-mode: multiply;
}

.fallback {
  position: absolute;
  inset: 14px;
  display: grid;
  place-items: center;
  width: calc(100% - 28px);
  height: calc(100% - 28px);
  color: rgba(255, 255, 255, .7);
  background: linear-gradient(135deg, #555, #aaa 48%, #ddd 72%, #444);
  filter: grayscale(1);
  font-family: Georgia, serif;
  font-size: clamp(56px, 10vw, 160px);
  font-style: italic;
}

.image-fit-toggle {
  position: absolute;
  right: 26px;
  bottom: 24px;
  z-index: 6;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  opacity: .2;
  color: #f1f1ec;
  border: 1px solid rgba(245, 245, 240, .38);
  background: rgba(15, 15, 14, .22);
  font-size: 0;
  cursor: pointer;
  backdrop-filter: blur(2px);
  transition: opacity .2s, background .2s, transform .2s;
}

.image-fit-toggle::before { content: "⤢"; color: #f3f3ee; font-family: Georgia, serif; font-size: 17px; line-height: 1; }
.image-fit-toggle[aria-pressed="true"]::before { content: "⤡"; }
.pic:hover .image-fit-toggle,
.image-fit-toggle:focus-visible { opacity: .82; background: rgba(15, 15, 14, .58); }
.image-fit-toggle:hover { background: rgba(15, 15, 14, .7); transform: translateY(-1px); }
.image-fit-toggle:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

.info {
  position: relative;
  display: grid;
  align-content: center;
  gap: 16px;
  min-width: 0;
  min-height: 0;
  height: 100%;
  max-height: 100%;
  padding: clamp(30px, 4vw, 58px) clamp(25px, 3vw, 46px);
  overflow-x: hidden;
  overflow-y: auto;
  color: #171717;
  border: 1px solid rgba(0, 0, 0, .22);
  background-color: #ededE9;
  background-image:
    radial-gradient(circle at 12% 16%, rgba(0, 0, 0, .06) 0 1px, transparent 1.3px),
    repeating-linear-gradient(91deg, rgba(0, 0, 0, .013) 0 1px, transparent 1px 6px);
  background-size: 21px 19px, auto;
  box-shadow: 11px 13px 0 rgba(0, 0, 0, .15);
  scrollbar-width: thin;
  transform: rotate(.35deg);
}

.info::before {
  content: "";
  position: absolute;
  top: 0;
  left: 16%;
  width: 110px;
  height: 23px;
  background: rgba(190, 190, 186, .72);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .18);
  transform: rotate(-2deg);
}

.kicker { margin-bottom: 0; color: #646462; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.route-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: .55em; color: #222; font-size: clamp(16px, 2vw, 26px); font-weight: 700; text-transform: uppercase; }
.route-original,
.route-drift { white-space: nowrap; }
.route-changed { display: inline-grid; place-items: center; min-width: .72em; margin: 0 .02em; color: #f1f1ed; background: #181818; box-shadow: 0 0 0 1px #181818; }
.route-changed.flicker { animation: route-letter-flicker .11s steps(2, end); }
.route-changed.settled { animation: route-letter-settle .42s cubic-bezier(.18, .8, .22, 1); }

@keyframes route-letter-flicker {
  0% { opacity: .15; transform: translateY(-2px); }
  50% { opacity: 1; filter: invert(1); }
  100% { opacity: .45; transform: translateY(2px); }
}

@keyframes route-letter-settle {
  0% { filter: invert(1); transform: translateY(-5px); }
  70% { filter: none; transform: translateY(2px); }
  100% { transform: translateY(0); }
}

.result-title {
  max-width: 100%;
  margin: 14px 0 10px;
  overflow-wrap: anywhere;
  color: #111;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(40px, 4.7vw, 82px);
  font-weight: 700;
  line-height: .94;
  text-shadow: .5px .5px rgba(0, 0, 0, .15);
}

.extract { max-width: 100%; margin-top: 10px; overflow-wrap: anywhere; color: #222; font-size: 14px; line-height: 1.85; }
.meta-line { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 14px; color: #646462; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.image-state { margin-top: 10px; color: #646462; font-size: 12px; }

.tools {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 20px;
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid rgba(0, 0, 0, .3);
}

.tool-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  color: #282827;
  border: 0;
  background: none;
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  cursor: pointer;
}

.tool-btn:hover { color: #000; text-decoration: underline; }
.tools #continue { margin-left: auto; animation: continue-invite 5.2s ease-in-out infinite; transform-origin: right center; }

.door-shape {
  position: relative;
  width: 22px;
  height: 34px;
  margin-right: 3px;
  border: 1.5px solid currentColor;
  border-radius: 1px;
  transform-style: preserve-3d;
  transform-origin: left center;
  animation: door-ajar 5.2s ease-in-out infinite;
}

.door-shape::before {
  content: "";
  position: absolute;
  top: 15px;
  right: 4px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: currentColor;
}

.door-shape::after {
  content: "";
  position: absolute;
  right: 3px;
  bottom: -7px;
  left: 3px;
  height: 1px;
  opacity: .55;
  background: currentColor;
}

@keyframes continue-invite {
  0%, 62%, 100% { opacity: .74; filter: drop-shadow(0 0 0 rgba(20, 20, 20, 0)); transform: translateX(0); }

/* V28 — Perceptual Drift / mobile sensing keyboard */
.tw-key[data-char] {
  position: relative;
  touch-action: none;
  cursor: pointer;
  left: var(--learn-x, 0px);
  top: var(--learn-y, 0px);
  transition: left .7s var(--ease-mechanical), top .7s var(--ease-mechanical), transform .07s, box-shadow .07s, background .1s, color .1s;
}

.tw-key[data-char]::after {
  content: "";
  position: absolute;
  left: var(--touch-x, 50%);
  top: var(--touch-y, 50%);
  width: 4px;
  height: 4px;
  opacity: var(--touch-opacity, 0);
  border-radius: 50%;
  background: #111;
  transform: translate(-50%, -50%);
  transition: opacity .6s ease;
  pointer-events: none;
}

.entry.sensing .tw-hint::before {
  content: "SENSING / ";
  color: #191919;
}

.sensor-readout {
  position: absolute;
  right: 0;
  bottom: -22px;
  left: 0;
  color: #666;

  text-align: center;
  text-transform: uppercase;

const touchSamples=[];
const motorProfile=new Map();
let activePointer=null;

function keyCenter(ch){
  const k=keyMap[ch]; if(!k) return null;
  const r=k.getBoundingClientRect();
  return {x:r.left+r.width/2,y:r.top+r.height/2};
}
function recordMotorSample(ch, el, e){
  const r=el.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const dx=(x-r.width/2)/(r.width/2), dy=(y-r.height/2)/(r.height/2);
  const sample={ch,dx,dy,down:performance.now(),duration:0};
  touchSamples.push(sample);
  activePointer=sample;
  el.style.setProperty('--touch-x',`${Math.max(0,Math.min(100,x/r.width*100))}%`);
  el.style.setProperty('--touch-y',`${Math.max(0,Math.min(100,y/r.height*100))}%`);
  el.style.setProperty('--touch-opacity','1');
  setTimeout(()=>el.style.setProperty('--touch-opacity','0'),520);
  const p=motorProfile.get(ch)||{n:0,dx:0,dy:0};
  p.n++; p.dx += (dx-p.dx)/p.n; p.dy += (dy-p.dy)/p.n;
  motorProfile.set(ch,p);
  // Slow co-adaptation: only a few px, preserving learned layout.
  const cap=6, gain=.28;
  el.style.setProperty('--learn-x',`${Math.max(-cap,Math.min(cap,p.dx*el.offsetWidth*gain))}px`);
  el.style.setProperty('--learn-y',`${Math.max(-cap,Math.min(cap,p.dy*el.offsetHeight*gain))}px`);
  $('entry').classList.add('sensing');
  $('sensorReadout').textContent=`${ch.toUpperCase()} · touch ${dx>=0?'→':'←'} ${Math.abs(dx).toFixed(2)} / ${dy>=0?'↓':'↑'} ${Math.abs(dy).toFixed(2)}`;
  return sample;
}
function finishMotorSample(sample){

function appendFromSurface(ch){

function pickByMotorDrift(word,list){
  if(!touchSamples.length) return null;
  let best=null, bestScore=.23; // require a meaningful directional bias
  for(const item of list){
    const p=diffPos(item.original,item.drift);
    const a=item.original[p], b=item.drift[p];
    const sample=touchSamples[p];
    if(!sample || sample.ch!==a) continue;
    const ca=keyCenter(a), cb=keyCenter(b); if(!ca||!cb) continue;
    let vx=cb.x-ca.x, vy=cb.y-ca.y;
    const vm=Math.hypot(vx,vy)||1; vx/=vm; vy/=vm;

    if(sm<.06) continue;

    const strength=Math.min(1,sm);

    if(state!==STATES.TYPING)return;

async function runSlip(item){

async function animateResultRoute(item){const token=++routeAnimationToken,route=$('route'),p=diffPos(item.original,item.drift),left=document.createElement('span'),arrow=document.createElement('span'),right=document.createElement('span');left.className='route-original';left.textContent=item.original.toUpperCase();arrow.textContent='→';right.className='route-drift';[...item.drift].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=(i===p?item.original[i]:ch).toUpperCase();if(i===p)s.className='route-changed';right.appendChild(s)});route.textContent='';route.append(left,arrow,right);route.setAttribute('aria-label',`${item.original} changes to ${item.drift}`);const changed=right.children[p];if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){changed.textContent=item.drift[p].toUpperCase();changed.classList.add('settled');return}const cycle=seq(item.original[p],item.drift[p]);await delay(TIMING.ROUTE_START);for(const ch of cycle){if(token!==routeAnimationToken)return;changed.textContent=ch.toUpperCase();changed.classList.remove('flicker');void changed.offsetWidth;changed.classList.add('flicker');await delay(TIMING.ROUTE_STEP)}changed.textContent=item.drift[p].toUpperCase();changed.classList.remove('flicker');changed.classList.add('settled')}

$('field').addEventListener('input',e=>{if(state!==STATES.TYPING)return;const v=e.target.value.replace(/[^a-zA-Z]/g,'').toLowerCase();const added=v.length>lastLen;e.target.value=v;renderPaper(v);if(added){const key=keyMap[v[v.length-1]];if(key){key.classList.add('press','press-ink');setTimeout(()=>key.classList.remove('press','press-ink'),TIMING.KEY_PRESS)}}lastLen=v.length});

$('begin').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();begin()});
$('imageFitToggle').onclick=()=>{const full=$('pic').classList.toggle('fit-full'),button=$('imageFitToggle'),label=full?'Fill frame':'View full image';button.textContent=label.toLowerCase();button.setAttribute('aria-label',label);button.title=label;button.setAttribute('aria-pressed',String(full));};
$('return').onclick=()=>{if(state!==STATES.RESULT)return;$('result').hidden=true;$('entry').hidden=false;resetStage('');$('field').focus({preventScroll:true})};
$('continue').onclick=()=>{if(state!==STATES.RESULT)return;const next=byOriginal.has(current.drift)?current.drift:current.original;$('result').hidden=true;$('entry').hidden=false;resetStage(next);setTimeout(()=>begin(next),TIMING.CONTINUE_DELAY)};
resetStage(''); if(window.matchMedia('(pointer:fine)').matches)$('field').focus({preventScroll:true});
</script></body></html>
