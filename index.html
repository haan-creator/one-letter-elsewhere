<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#b9b9b5" />
<title>One Letter Elsewhere — Adaptive Keyboard Study</title>
<style>
:root{--ink:#151515;--canvas:#b9b9b5;--paper:#efefeb;--muted:#666;--ease:cubic-bezier(.5,0,.2,1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--canvas);color:var(--ink);font-family:"Courier New",ui-monospace,Menlo,monospace}button{font:inherit}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;mix-blend-mode:multiply;background-image:radial-gradient(circle at 17% 23%,rgba(0,0,0,.2) 0 .45px,transparent .7px),radial-gradient(circle at 71% 64%,rgba(0,0,0,.14) 0 .5px,transparent .8px);background-size:7px 9px,11px 13px}
.scene{min-height:100dvh;padding:22px clamp(16px,4vw,42px);display:grid;grid-template-rows:auto 1fr auto;gap:14px;background:radial-gradient(ellipse at 50% 42%,#e4e4e0 0,#cececa 58%,#b4b4b0 100%)}
.top,.footer{position:relative;z-index:3;color:#50504e;font-size:10px;letter-spacing:.14em;text-transform:uppercase}.top{display:flex;justify-content:space-between;gap:18px}.top div:last-child{text-align:right}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px}
.main{display:grid;place-items:center;min-height:0}.stage{width:min(720px,100%);display:grid;justify-items:center;gap:18px}
.paper{width:min(600px,92vw);min-height:210px;padding:40px 34px 54px;border:1px solid rgba(0,0,0,.19);background-color:var(--paper);background-image:radial-gradient(circle at 18% 22%,rgba(0,0,0,.055) 0 1px,transparent 1.4px),repeating-linear-gradient(87deg,rgba(255,255,255,.12) 0 1px,rgba(0,0,0,.018) 1px 2px,transparent 2px 7px);background-size:17px 19px,auto;box-shadow:0 2px 0 rgba(255,255,255,.5),0 13px 28px rgba(0,0,0,.22);position:relative;overflow:hidden}
.paper:before{content:"typing sample / no correction";position:absolute;top:17px;left:22px;color:#777;font-size:9px;letter-spacing:.16em;text-transform:uppercase}.typed{min-height:1.3em;margin-top:20px;overflow-wrap:anywhere;color:#232019;font-size:clamp(28px,6vw,48px);font-weight:700;letter-spacing:.1em;text-transform:lowercase}.typed .caret{display:inline-block;width:.5em;animation:blink .8s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.prompt{margin-top:20px;color:#5b5b58;font-size:11px;line-height:1.6}.prompt strong{color:#222}.stats{margin-top:10px;color:#777;font-size:10px;letter-spacing:.05em}
.typewriter{width:min(700px,98vw);padding:20px 14px 24px;border:1px solid #111;border-radius:16px 16px 10px 10px;background:linear-gradient(150deg,#4b4b49,#20201f 68%);box-shadow:0 22px 46px rgba(0,0,0,.38),inset 0 2px 0 rgba(255,255,255,.1);touch-action:none}.keys{display:grid;gap:10px}.row{display:flex;justify-content:center;gap:clamp(5px,1.4vw,9px)}.row:nth-child(2){padding-left:4%}.row:nth-child(3){padding-left:10%}
.key{--mx:0px;--my:0px;--sx:1;--sy:1;position:relative;display:grid;place-items:center;width:clamp(30px,8.6vw,48px);height:clamp(38px,10.5vw,52px);padding:0;border:2px solid #111;border-radius:46% 46% 42% 42%;color:#181818;background:radial-gradient(circle at 35% 30%,#eeeeea,#c6c6c1 60%,#8b8b87);box-shadow:0 5px 0 #111;font-size:clamp(12px,3.4vw,16px);font-weight:700;text-transform:uppercase;user-select:none;-webkit-user-select:none;transform:translate(var(--mx),var(--my)) scale(var(--sx),var(--sy));transition:transform .6s var(--ease),width .6s var(--ease),height .6s var(--ease),box-shadow .08s}.key.down{box-shadow:0 1px 0 #111;transform:translate(var(--mx),calc(var(--my) + 4px)) scale(var(--sx),var(--sy))}.key:after{content:"";position:absolute;width:9px;height:9px;border:1px solid rgba(0,0,0,.45);border-radius:50%;left:calc(var(--tx,50%) - 4.5px);top:calc(var(--ty,50%) - 4.5px);opacity:var(--touch-opacity,0);transition:opacity .4s;pointer-events:none}.utility{width:auto;min-width:54px;padding:0 14px;color:#eee;background:radial-gradient(circle at 35% 30%,#696967,#343433);border-radius:12px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.control{border:1px solid #555;background:rgba(239,239,235,.78);color:#333;padding:8px 11px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}.control[aria-pressed="true"]{background:#222;color:#eee}
.memory{width:min(600px,92vw);display:none;padding:14px 16px;border:1px solid rgba(0,0,0,.24);background:rgba(239,239,235,.78);box-shadow:5px 6px 0 rgba(0,0,0,.09)}.memory.on{display:block}.memory-title{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:#666;margin-bottom:10px}.memory-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.memory-cell{min-height:56px;border:1px solid rgba(0,0,0,.15);padding:6px;font-size:9px;color:#555}.memory-cell b{display:block;color:#111;font-size:13px;margin-bottom:3px}.arrow{font-size:15px;color:#222}.empty{opacity:.35}
@media(max-width:600px){.scene{padding:14px 10px}.top{display:block;padding:0 6px}.top div:last-child{text-align:left;margin-top:5px}.paper{min-height:170px;padding:34px 20px 40px}.typewriter{padding:17px 7px 20px}.keys{gap:8px}.row{gap:5px}.key{width:8.9vw;height:11.4vw;min-width:29px;min-height:39px}.utility{min-width:49px;padding:0 10px}.memory-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.footer{padding:0 6px;align-items:flex-end}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<section class="scene">
  <div class="top"><div>one letter elsewhere / adaptive keyboard study</div><div>the keyboard remembers where your fingers actually land</div></div>
  <main class="main"><div class="stage">
    <section class="paper" aria-live="polite">
      <div id="typed" class="typed"><span class="caret">▌</span></div>
      <div class="prompt">先正常打，不要刻意瞄準鍵中央。鍵盤只學習你的<strong>實際落點</strong>，不再替你把字母飄移到別的世界。</div>
      <div id="stats" class="stats">0 touches remembered</div>
    </section>
    <div class="typewriter"><div id="keys" class="keys"></div></div>
    <div class="controls">
      <button id="memoryToggle" class="control" type="button" aria-pressed="false">keyboard memory</button>
      <button id="clearText" class="control" type="button">clear text</button>
      <button id="resetMemory" class="control" type="button">reset memory</button>
    </div>
    <section id="memory" class="memory"><div class="memory-title">body map / average landing point</div><div id="memoryGrid" class="memory-grid"></div></section>
  </div></main>
  <div class="footer"><span>procedural memory / co-adaptation</span><span id="status">memory stored on this device</span></div>
</section>
<script>
const ROWS=['qwertyuiop','asdfghjkl','zxcvbnm'];
const STORAGE='ole-adaptive-keyboard-v1';
const MAX_SHIFT=9;       // px: visible, but not enough to destroy learned layout
const GAIN=.42;          // adaptation gain from average normalized landing point
const MIN_SAMPLES=2;     // movement begins after the second touch
const keys={};
let text='';
let active=new Map();
let profile=loadProfile();

function loadProfile(){
  try{return JSON.parse(localStorage.getItem(STORAGE)||'{}')}catch(e){return {}}
}
function saveProfile(){
  try{localStorage.setItem(STORAGE,JSON.stringify(profile));document.getElementById('status').textContent='memory saved on this device'}catch(e){document.getElementById('status').textContent='memory active for this session'}
}
function ensure(ch){return profile[ch]||(profile[ch]={n:0,dx:0,dy:0,absx:0,absy:0,meanDuration:0})}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function arrow(dx,dy){
  if(Math.hypot(dx,dy)<.08)return '·';
  const a=Math.atan2(dy,dx), oct=Math.round(a/(Math.PI/4));
  return ['→','↘','↓','↙','←','↖','↑','↗','→'][oct<0?oct+8:oct];
}
function build(){
  const wrap=document.getElementById('keys');
  ROWS.forEach((row,ri)=>{
    const line=document.createElement('div');line.className='row';
    [...row].forEach(ch=>{
      const b=document.createElement('button');b.type='button';b.className='key';b.dataset.char=ch;b.textContent=ch;b.setAttribute('aria-label',ch.toUpperCase());keys[ch]=b;line.appendChild(b);
    });
    if(ri===2){
      const back=document.createElement('button');back.type='button';back.className='key utility';back.id='back';back.textContent='⌫';back.setAttribute('aria-label','delete');line.appendChild(back);
      const space=document.createElement('button');space.type='button';space.className='key utility';space.id='space';space.textContent='space';space.setAttribute('aria-label','space');line.appendChild(space);
    }
    wrap.appendChild(line);
  });
  Object.entries(keys).forEach(([ch,b])=>bindKey(ch,b));
  document.getElementById('back').addEventListener('pointerdown',e=>{e.preventDefault();text=text.slice(0,-1);renderText()});
  document.getElementById('space').addEventListener('pointerdown',e=>{e.preventDefault();text+=' ';renderText()});
  applyAll();renderMemory();updateStats();
}
function bindKey(ch,b){
  b.addEventListener('pointerdown',e=>{
    e.preventDefault();
    try{b.setPointerCapture(e.pointerId)}catch(_){ }
    const r=b.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    const dx=(x-r.width/2)/(r.width/2),dy=(y-r.height/2)/(r.height/2);
    b.style.setProperty('--tx',`${clamp(x/r.width*100,0,100)}%`);b.style.setProperty('--ty',`${clamp(y/r.height*100,0,100)}%`);b.style.setProperty('--touch-opacity','1');
    const sample={ch,dx,dy,t:performance.now()};active.set(e.pointerId,sample);b.classList.add('down');
    learn(ch,dx,dy,0);text=(text+ch).slice(-80);renderText();
  });
  const finish=e=>{
    const s=active.get(e.pointerId);if(!s)return;active.delete(e.pointerId);b.classList.remove('down');b.style.setProperty('--touch-opacity','0');
    const duration=performance.now()-s.t;learnDuration(ch,duration);renderMemory();updateStats();
  };
  b.addEventListener('pointerup',finish);b.addEventListener('pointercancel',finish);
}
function learn(ch,dx,dy){
  const p=ensure(ch);p.n++;
  p.dx+=(dx-p.dx)/p.n;p.dy+=(dy-p.dy)/p.n;
  p.absx+=(Math.abs(dx)-p.absx)/p.n;p.absy+=(Math.abs(dy)-p.absy)/p.n;
  saveProfile();applyKey(ch);renderMemory();updateStats();
}
function learnDuration(ch,d){const p=ensure(ch);p.meanDuration+=(d-p.meanDuration)/Math.max(1,p.n);saveProfile()}
function applyKey(ch){
  const b=keys[ch],p=profile[ch];if(!b||!p||p.n<MIN_SAMPLES){b?.style.setProperty('--mx','0px');b?.style.setProperty('--my','0px');return}
  const sx=clamp(p.dx*b.offsetWidth*GAIN,-MAX_SHIFT,MAX_SHIFT),sy=clamp(p.dy*b.offsetHeight*GAIN,-MAX_SHIFT,MAX_SHIFT);
  b.style.setProperty('--mx',`${sx.toFixed(2)}px`);b.style.setProperty('--my',`${sy.toFixed(2)}px`);
}
function applyAll(){Object.keys(keys).forEach(applyKey)}
function renderText(){document.getElementById('typed').innerHTML=`${escapeHtml(text)}<span class="caret">▌</span>`}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function updateStats(){const total=Object.values(profile).reduce((s,p)=>s+(p.n||0),0),trained=Object.values(profile).filter(p=>(p.n||0)>=MIN_SAMPLES).length;document.getElementById('stats').textContent=`${total} touches remembered · ${trained} keys adapting`}
function renderMemory(){
  const grid=document.getElementById('memoryGrid');grid.textContent='';
  [...'abcdefghijklmnopqrstuvwxyz'].forEach(ch=>{
    const p=profile[ch],c=document.createElement('div');c.className='memory-cell'+(!p||!p.n?' empty':'');
    if(!p||!p.n)c.innerHTML=`<b>${ch.toUpperCase()}</b>no samples`;
    else c.innerHTML=`<b>${ch.toUpperCase()}</b><span class="arrow">${arrow(p.dx,p.dy)}</span> ${p.n}×<br>avg ${Math.hypot(p.dx,p.dy).toFixed(2)}`;
    grid.appendChild(c);
  })
}
document.getElementById('memoryToggle').onclick=()=>{const m=document.getElementById('memory'),b=document.getElementById('memoryToggle'),on=!m.classList.contains('on');m.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on))};
document.getElementById('clearText').onclick=()=>{text='';renderText()};
document.getElementById('resetMemory').onclick=()=>{if(!confirm('Reset the keyboard memory on this device?'))return;profile={};saveProfile();applyAll();renderMemory();updateStats()};
window.addEventListener('resize',applyAll);
// Desktop physical keyboard can still add text, but only touches/clicks on the visible keys train the body map.
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;if(/^[a-zA-Z]$/.test(e.key)){text=(text+e.key.toLowerCase()).slice(-80);renderText()}else if(e.key==='Backspace'){text=text.slice(0,-1);renderText()}else if(e.key===' '){text+=' ';renderText()}});
build();renderText();
</script>
</body>
</html>
